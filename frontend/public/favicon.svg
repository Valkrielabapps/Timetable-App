<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Simple black/white "T" monogram — replaces the leftover default
       Vite-template favicon (a purple gradient blob unrelated to the
       brand). Built from two plain rectangles rather than rendered text,
       so it stays crisp and legible at 16x16 without depending on any
       font being available wherever this gets rasterized. -->
  <rect width="64" height="64" rx="14" fill="#0a0a0a" />
  <rect x="14" y="16" width="36" height="8" rx="2" fill="#ffffff" />
  <rect x="28" y="16" width="8" height="32" rx="2" fill="#ffffff" />
</svg>
